name: Update Pegelstände

on:
  schedule:
    - cron: "0 5 * * *"  # täglich 05:00 UTC: nur Live-Daten (letzte ~31 Tage)
    - cron: "0 3 * * 1"  # montags 03:00 UTC: volle Historie seit 2000 (langsam, ~2-3h)
  workflow_dispatch:
    inputs:
      full:
        description: "Volle Historie neu laden (statt nur Live-Daten)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-pegelstaende
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Precompute data (live-only)
        if: github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full != 'true')
        run: python3 precompute.py --live-only

      - name: Precompute data (full history)
        if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true')
        run: python3 precompute.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Pegelstände-Daten"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done

          echo "Push failed after retries"
          exit 1
